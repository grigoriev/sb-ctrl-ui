sonar.projectKey=grigoriev_sb-ctrl-ui
sonar.organization=grigoriev

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=dist/**,node_modules/**,src/main.tsx,src/vite-env.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,src/main.tsx

# False positives: this client stores its own API URL/token and calls its own
# configured endpoint. There is no untrusted trust boundary crossing.
sonar.issue.ignore.multicriteria=fp1,fp2
sonar.issue.ignore.multicriteria.fp1.ruleKey=tssecurity:S8475
sonar.issue.ignore.multicriteria.fp1.resourceKey=src/api.ts
sonar.issue.ignore.multicriteria.fp2.ruleKey=tssecurity:S8476
sonar.issue.ignore.multicriteria.fp2.resourceKey=src/api.ts
